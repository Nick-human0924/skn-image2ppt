interface:
  display_name: "SKN Image2PPT"
  short_description: "V6.6 topology-faithful Image2PPT with execution QA"
  default_prompt: "Use skn-image2ppt V6.6 to convert this reference image into a high-fidelity editable PPTX. Create a unique RUN_ROOT, choose hybrid/native/frame-layer reconstruction mode, and produce topology_lock.json, visual_element_ledger.json, imagegen-assets-manifest.json when generated layers are used, icon_extraction_plan.json, and layout/deck JSON with source_bbox for every positioned text/icon/asset. Preserve the reference structure and every meaningful non-text visual element. Use imagegen only with the current source image as edit target, keep business text/tables/labels/arrows editable, make icons independently movable/copyable, calculate text size from source pixel height, compose with compose_pptx.py when using the standard layered path, then run layout_guard, placement overlays, visual diff, pptx_editability_lint, frame-anchor calibration, and Polish Pass before delivery."
