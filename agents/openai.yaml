interface:
  display_name: "SKN Image2PPT"
  short_description: "V6.5 topology-faithful Image2PPT with engineering QA"
  default_prompt: "Use skn-image2ppt V6.5 to convert this reference image into a high-fidelity editable PPTX. Create a unique RUN_ROOT, topology_lock.json, visual_element_ledger.json, icon_extraction_plan.json, and layout with source_bbox for every positioned text/icon/asset. Preserve the reference structure and every meaningful non-text visual element. Generate or clean high-quality text-free visual assets only where needed, keep business text/tables/labels/arrows editable, make icons independently movable/copyable, calculate text size from source pixel height, then run layout guard, placement overlays, visual diff, frame-anchor calibration, and Polish Pass before delivery."
